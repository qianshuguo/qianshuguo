<!DOCTYPE html>
<html lang='en'>
<head>
    <title>Contact — Qianshu Guo</title>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1' />
    <meta name='theme-color' content='#f5f2eb'/>
    <link rel="preload" href="assets/fonts/Mynerve-Qianshu.woff2?v=2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="assets/fonts/PlayfairDisplay-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="assets/fonts/EBGaramond-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="assets/fonts/CormorantGaramond-MediumItalic.woff2" as="font" type="font/woff2" crossorigin>
    <link href="assets/fonts/fonts.css" rel="stylesheet">
    <link href="assets/site.css?v=3" rel="stylesheet">
    <style>
        .page-content {
            max-width: 800px;
            margin: 0 auto;
            padding: 38px 40px 100px;
        }

        .page-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(36px, 5vw, 56px);
            font-weight: 400;
            margin-bottom: 16px;
            letter-spacing: .01em;
        }

        .contact-intro {
            font-size: 18px;
            font-style: italic;
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-weight: 500;
            color: var(--muted);
            margin-bottom: 48px;
        }

        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 11px;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .form-group input,
        .form-group textarea {
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border);
            padding: 8px 0;
            font-family: 'EB Garamond', Georgia, serif;
            font-size: 17px;
            color: var(--text);
            outline: none;
            width: 100%;
            transition: border-color 0.2s;
        }
        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: var(--border);
        }
        .form-group input:focus,
        .form-group textarea:focus {
            border-bottom-color: var(--text);
        }
        .form-group textarea {
            resize: none;
            height: 130px;
            line-height: 1.6;
        }

        .form-submit button {
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            font-weight: 400;
            color: var(--text);
            background: none;
            border: none;
            border-bottom: 1px solid var(--text);
            padding-bottom: 2px;
            cursor: pointer;
            letter-spacing: .04em;
            transition: color 0.2s, border-color 0.2s;
        }
        .form-submit button:hover { color: var(--accent); border-color: var(--accent); }
        .form-submit button:disabled {
            color: var(--muted);
            border-color: var(--border);
            cursor: wait;
        }

        .form-status {
            display: none;
            font-size: 16px;
            font-style: italic;
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-weight: 500;
            color: var(--muted);
            margin-top: 8px;
        }
        .form-status.is-visible { display: block; }
        .form-status.is-error { color: #9a4f44; }

        .form-honey {
            position: absolute;
            left: -9999px;
            width: 1px;
            height: 1px;
            overflow: hidden;
        }

        @media (max-width: 600px) {
            .page-content { padding: 32px 24px 80px; }
        }
    </style>
</head>
<body class="inner-page">

    <nav class="site-nav">
        <a class="name" href="index.html">Qianshu Guo</a>
        <div class="links">
            <a href="works.html">Works</a>
            <a href="about.html">About</a>
            <a href="cv.html">CV</a>
            <a href="contact.html" aria-current="page">Contact</a>
        </div>
    </nav>

    <div class="page-content">
        <div class="page-title">Contact</div>
        <p class="contact-intro">Feel free to reach out for collaborations, commissions, or any enquiries.</p>

        <form
            class="contact-form"
            id="contact-form"
            action="https://formsubmit.co/qianshu.guo@outlook.com"
            method="POST"
        >
            <input type="hidden" name="_template" value="table">
            <input type="hidden" name="_captcha" value="false">
            <div class="form-honey" aria-hidden="true">
                <label for="website">Website</label>
                <input type="text" id="website" name="_honey" tabindex="-1" autocomplete="off">
            </div>
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Your name" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="your@email.com" required>
            </div>
            <div class="form-group">
                <label for="subject">Subject</label>
                <input type="text" id="subject" name="subject" placeholder="What is this about?">
            </div>
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="Your message..." required></textarea>
            </div>
            <div class="form-submit">
                <button type="submit" id="submit-button">Send →</button>
                <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
            </div>
        </form>
    </div>

    <script>
        const form = document.getElementById('contact-form');
        const submitButton = document.getElementById('submit-button');
        const formStatus = document.getElementById('form-status');

        form.addEventListener('submit', async function (event) {
            event.preventDefault();

            const formData = new FormData(form);
            const subject = formData.get('subject') || 'Message from website';
            formData.set('_subject', subject);

            submitButton.disabled = true;
            submitButton.textContent = 'Sending…';
            formStatus.className = 'form-status';
            formStatus.textContent = '';

            try {
                const response = await fetch(
                    'https://formsubmit.co/ajax/qianshu.guo@outlook.com',
                    {
                        method: 'POST',
                        headers: { 'Accept': 'application/json' },
                        body: formData
                    }
                );

                if (!response.ok) {
                    throw new Error('Form submission failed');
                }

                form.reset();
                formStatus.textContent = "Thank you — your message has been sent. I'll be in touch soon.";
                formStatus.className = 'form-status is-visible';
            } catch (error) {
                formStatus.textContent = 'Sorry, the message could not be sent. Please try again in a moment.';
                formStatus.className = 'form-status is-visible is-error';
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = 'Send →';
            }
        });
    </script>

</body>
</html>
