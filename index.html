<!DOCTYPE html>
<html lang='en'>
<head>
    <title>Qianshu Guo</title>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1' />
    <meta name='theme-color' content='#f5f2eb'/>
    <link rel="preload" href="assets/fonts/Mynerve-Qianshu.woff2?v=2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="assets/fonts/PlayfairDisplay-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="assets/fonts/EBGaramond-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link href="assets/fonts/fonts.css" rel="stylesheet">
    <link href="assets/site.css" rel="stylesheet">
    <style>
        body {
            font-size: initial;
            line-height: normal;
        }

        .hero {
            position: relative;
            isolation: isolate;
            overflow: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 60px 40px;
        }

        .hero > * {
            position: relative;
            z-index: 1;
            animation: inner-page-arrive .38s cubic-bezier(.22, .72, .28, 1) both;
        }

        .hero h1 {
            font-family: 'Mynerve', cursive;
            font-size: clamp(52px, 8vw, 96px);
            font-weight: 400;
            letter-spacing: .01em;
            line-height: 1.1;
            margin-bottom: 0;
        }

        .hero-name {
            z-index: 0;
            margin-bottom: 20px;
        }

        .hero .subtitle {
            font-family: 'EB Garamond', Georgia, serif;
            font-size: clamp(16px, 1.6vw, 18px);
            font-style: normal;
            font-weight: 400;
            letter-spacing: .14em;
            color: var(--muted);
            margin-bottom: 68px;
        }

        .hero-links {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hero-links a {
            display: block;
            font-family: 'Playfair Display', serif;
            font-size: clamp(20px, 2.2vw, 27px);
            font-weight: 400;
            color: var(--text);
            text-decoration: none;
            padding: 7px 0;
            letter-spacing: .12em;
            transition:
                color .42s ease,
                transform .32s ease;
        }
        .hero-links a:hover {
            color: var(--accent-hover);
            transform: translateY(-1px);
        }
        .hero-links a:focus-visible {
            outline: 1px solid rgba(138, 114, 82, 0.45);
            outline-offset: 4px;
        }

        @media (max-width: 600px) {
            .hero { padding: 60px 24px; }
            .hero .subtitle {
                font-size: 14px;
                letter-spacing: .1em;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .hero > * {
                animation: none;
            }
            .hero-links a {
                transition: none;
            }
            .hero-links a:hover {
                transform: none;
            }
        }
    </style>
</head>
<body>
    <div class="hero">
        <div class="hero-name name-glow-anchor">
            <h1>Qianshu Guo</h1>
        </div>
        <p class="subtitle">FILM COMPOSER · SOUND DESIGNER</p>
        <div class="hero-links">
            <a href="works.html">Works</a>
            <a href="about.html">About</a>
            <a href="cv.html">CV</a>
            <a href="contact.html">Contact</a>
        </div>
    </div>
</body>
</html>
